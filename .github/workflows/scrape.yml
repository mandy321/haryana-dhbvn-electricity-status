name: Scrape DHBVN Outages

on:
  schedule:
    # Multiple staggered crons help avoid congested top-of-hour GitHub scheduler delays
    - cron: '3,23,43 * * * *'
  workflow_dispatch:      # Allow manual and webhook-based triggers
  repository_dispatch:    # Allow external cron services (cron-job.org / curl) to trigger on demand
    types: [scrape_dhbvn]

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write     # Allow committing and pushing data

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Run Scraper
      run: npm run scrape

    - name: Commit and Push outages.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/outages.json data/history/
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes in outages or history"
        else
          git commit -m "Update outages and history archives [skip ci]"
          git push origin main || git push origin master
        fi
